[tool.poetry]
name = "nexa-backtest"
version = "0.1.0b2"
description = "Backtesting framework for European power markets"
authors = ["Phase Nexa <dev@phasenexa.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "nexa_backtest", from = "src" }]
repository = "https://github.com/phasenexa/nexa-backtest"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = ">=2.0"
pyarrow = ">=14.0"
numpy = ">=1.26"
pandas = ">=2.0"
click = ">=8.0"

[tool.poetry.scripts]
nexa = "nexa_backtest.cli.main:cli"

[tool.poetry.extras]
plot = ["matplotlib"]
ml = ["onnxruntime", "scikit-learn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
mypy = ">=1.8"
ruff = ">=0.3"
pandas-stubs = ">=2.0"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C4", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/nexa_backtest"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
